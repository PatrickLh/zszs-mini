<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>宗师之上 · 修行筹算</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="#">宗<span>师</span>之上 <small>修行筹算</small></a><span class="prototype">资料库 · 预览版</span></header>
<main><nav id="activities" class="activity-switch" aria-label="选择周活动"></nav><section class="simple-title"><h1 id="activity-title">山海灵宝</h1><button id="help" class="help-button"><span>ⓘ</span> 计算说明</button></section>
<section class="card planning-card"><div class="inventory-line"><label id="stock-label" for="stock"></label><div class="stock-box"><input id="stock" type="number" min="0" max="1000000" value="0"><span>个</span></div></div><label class="weekly-option"><input id="weekly" type="checkbox" checked><span id="weekly-label"></span><input id="weekly-currency" class="weekly-currency" type="number" min="0" value="42" aria-label="本周附带代币数量"></label><div id="weekly-note" class="weekly-note"></div><section id="paid-planning" class="paid-planning" aria-label="付费礼包组合"><div class="paid-heading"><h2><button id="paid-toggle" class="paid-toggle" type="button" aria-expanded="false" aria-controls="paid-content"><span class="paid-chevron" aria-hidden="true"></span>付费礼包<span id="paid-toggle-label" class="paid-toggle-label">展开</span></button></h2><div class="paid-heading-actions"><span id="paid-caption">未选择 · 可选</span><button id="clear-paid" class="text-button" type="button">清空组合</button></div></div><div id="paid-content" hidden><div id="paid-packs" class="paid-packs" tabindex="0" aria-label="横向滑动选择付费礼包"></div><div class="paid-body"><div id="paid-result" class="paid-result" aria-live="polite"></div><p class="paid-note">左右滑动选择档位 · 库存不含所选礼包，避免重复计入。材料按任务阶梯计算代币。</p></div></div></section><div id="material-total" class="material-total" aria-live="polite" hidden></div><div class="round-strip" id="stages" aria-label="横向滑动查看七轮材料需求"></div><div class="strip-note">左右滑动查看轮次 · 点击预览该轮兑换币，修改库存恢复自动联动</div></section>
<section class="card shop"><div class="section-head"><h2>活动宝库</h2><button id="clear" class="text-button">重置兑换</button></div><div class="wallet"><label><span id="wallet-label"></span> <input id="wallet" type="number" min="0" value="0" readonly tabindex="-1" aria-label="自动计算的代币余额"></label><span id="spent"></span></div><p class="hint"><span id="wallet-note"></span>点击商品兑换，累计消耗达标后解锁下一层。</p><div id="shop"></div></section>
<div id="drawer" class="drawer-overlay" hidden><section class="drawer"><div class="section-head"><h2>计算说明与详细规划</h2><button id="close" class="text-button">关闭</button></div><p id="calculation-note" class="hint"></p><p class="hint">先达到节点再领取奖励，不计随机直接掉落。宝库独立模拟兑换，材料返还在底部展示，未抵扣上方阶段需求。可用代币由上方材料库存、所选轮次、每周附带数量及礼包组合自动计算。</p><div class="table-wrap"><table><thead><tr><th>任务</th><th>预计累计消耗</th><th>任务返还</th><th id="table-currency">兑换币结余</th></tr></thead><tbody id="details"></tbody></table></div></section></div>
<footer>宗师之上 · 玩家规划工具 <span>数据依据：仙君轮换活动配置 · 非官方</span></footer></main><script type="module" src="app.js"></script></body></html>
